[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["."]

addopts = """
-v
--tb=short
--cov=.
--cov-report=term-missing
--cov-report=html
"""

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]